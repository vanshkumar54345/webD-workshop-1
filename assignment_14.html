<!DOCTYPE html>
<html lang="en">
<head>
    <title>Nested and Responsive Tables</title>
</head>
<body>
    <table border="1" cellpadding="8" cellspacing="0" width="300">
        <tr>
            <th>Day</th>
            <th>Lab Batches</th>
            <th>Faculty</th>
            <th>Room</th>
            <th>Time</th>
        </tr>
        <tr>
            <td>Friday</td>
            <td align="center">
                <table border="1" cellpadding="8" cellspacing="0" width="300">
                    <tr>
                    <th align="center">Batch</th>
                    <th align="center">System</th>
                    </tr>
                    <tr>
                        <td align="center">A1</td>
                        <td align="center">PC-20</td>
                    </tr>
                    <tr>
                        <td align="center">A2</td>
                        <td align="center">PC 21-40</td>
                    </tr>
                </table>
            </td>
            <td align="center">Dr. Sharma</td>
            <td align="center">Lab 2</td>
            <td align="center">2-4 PM</td>

        </tr>
    </table>
</body>
</html>
