<!DOCTYPE html>
<html lang="en">
<head>
    <title>Rowspan and Colspan (Timetable)</title>
</head>
<body>
    <h4>Weekly Timetable</h4>
    <table border="1" cellpadding="8" cellspacing="0" width="300">
        <tr>
            <th align="center">Day</th>
            <th align="center">9-10</th>
            <th align="center">10-11</th>
            <th align="center">11-12</th>
        </tr>
        <tr>
            <td align="center">Mon</td>
            <td align="center">Maths</td>
            <td align="center">HTML</td>
            <td rowspan="2" align="center">Web Lab</td>
        </tr>
        <tr>
            <td align="center">tue</td>
            <td align="center">DBMS</td>
            <td align="center">OS</td>
        </tr>
        <tr>
            <td align="center">Wed</td>
            <td colspan="3" align="center">Seminar</td>
        </tr>
    </table>
</body>
</html>
