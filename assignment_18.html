<!DOCTYPE html>
<html lang="en">
<head>
    <title>ABC College Admission</title>
    <style>
        h1 {
            text-align: center;
            background-color: navy;
            color: white;
            text-align: center;
            padding: 20px;
            margin: auto;
        }
        h2 {
            text-align: left;
        }
        table {
            border-collapse: collapse;
            margin: 20px;
            width: 100%;
        }

        th, td {
            border: 1px solid navy;
            padding: 5px;
            text-align: left;
        }

        th {
            background-color: lightgray;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>ABC College Admission 2026</h1>
    <h2>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Courses and Fees</h2>
    <table border="1" width="880px">
    <caption>Available Courses</caption>
    <tr>
        <th>Courses</th>
        <th>Seats</th>
        <th>Fees</th>
    </tr>

    <tr>
        <td>B.Tech CSE</td>
        <td>120</td>
        <td>₹90,000</td>
    </tr>

    <tr>
        <td>BCA</td>
        <td>60</td>
        <td>₹45,000</td>
    </tr>

    </table>
     <fieldset>
    <legend>Application Form</legend>
    <label for="Name">Name:</label>
    <br>
    <input type="name">
    <br><br>
    <label for="email">Email:</label>
    <br>
    <input type="email">
    <br><br>
    <label for="#">Course:</label>
    <br>
    <select>
        <option>B.Tech CSE</option>
        <option>B.Tech AIML</option>
        <option>B.Tech ECE</option>
        <option>B.Tech ME</option>
    </select>
    <br><br>
    <label for="#">Statement:</label>
    <br>
    <textarea row="70" cols="70"></textarea>
    <br><br>
    <button type="submit">Apply</button>
    </fieldset>
</body>
</html>
